<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Register | SpendSmart</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, sans-serif;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            background: linear-gradient(135deg, #e8fff5, #f5f7ff);
        }

        .auth-card {
            width: 100%;
            max-width: 420px;
            padding: 35px;
            background: white;
            border-radius: 18px;
            box-shadow: 0 12px 40px rgba(0, 0, 0, 0.08);
        }

        .logo {
            text-align: center;
            font-size: 28px;
            font-weight: bold;
            color: #087c58;
            margin-bottom: 25px;
        }

        h1 {
            text-align: center;
            font-size: 25px;
            margin-bottom: 10px;
        }

        .subtitle {
            text-align: center;
            color: #747e91;
            font-size: 14px;
            line-height: 1.6;
            margin-bottom: 25px;
        }

        .field {
            margin-bottom: 18px;
        }

        label {
            display: block;
            font-size: 14px;
            font-weight: bold;
            margin-bottom: 8px;
        }

        input {
            width: 100%;
            padding: 13px;
            border: 1px solid #dfe4ed;
            border-radius: 9px;
            font-size: 15px;
        }

        input:focus {
            outline: 2px solid #16a779;
            border-color: #16a779;
        }

        button {
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: 9px;
            background: #16a779;
            color: white;
            font-size: 15px;
            font-weight: bold;
            cursor: pointer;
        }

        button:hover {
            background: #087c58;
        }

        button:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        .message {
            margin-top: 15px;
            font-size: 14px;
            line-height: 1.6;
            text-align: center;
            overflow-wrap: anywhere;
        }

        .login-link {
            text-align: center;
            margin-top: 22px;
            font-size: 14px;
            color: #747e91;
        }

        a {
            color: #087c58;
            font-weight: bold;
        }

        @media (max-width: 480px) {
            .auth-card {
                padding: 25px 20px;
            }
        }
    </style>
</head>

<body>

    <main class="auth-card">

        <div class="logo">SpendSmart.</div>

        <h1>Create your account</h1>

        <p class="subtitle">
            Start managing your money and tracking your expenses.
        </p>

        <form id="registerForm">

            <div class="field">
                <label for="email">Email address</label>

                <input
                    type="email"
                    id="email"
                    autocomplete="email"
                    placeholder="you@example.com"
                    required
                >
            </div>

            <div class="field">
                <label for="password">Password</label>

                <input
                    type="password"
                    id="password"
                    autocomplete="new-password"
                    minlength="8"
                    placeholder="At least 8 characters"
                    required
                >
            </div>

            <div class="field">
                <label for="confirmPassword">Confirm password</label>

                <input
                    type="password"
                    id="confirmPassword"
                    autocomplete="new-password"
                    minlength="8"
                    placeholder="Enter your password again"
                    required
                >
            </div>

            <button type="submit" id="registerButton">
                Create Account
            </button>

            <p
                id="message"
                class="message"
                role="status"
                aria-live="polite"
            ></p>

        </form>

        <p class="login-link">
            Already have an account?
            <a href="login.html">Log in</a>
        </p>

    </main>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="supabase.js"></script>
    <script src="auth.js"></script>

</body>
</html>
